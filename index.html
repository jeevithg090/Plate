<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICAS — International Center for Applied Science</title>
    <meta
      name="description"
      content="A modern, accessible institute advancing research, medicine, and education worldwide."
    />
    <meta
      name="theme-color"
      content="#c2410c"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1120"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta
      property="og:title"
      content="ICAS — International Center for Applied Science"
    />
    <meta
      property="og:description"
      content="Advancing knowledge. Improving lives."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ICAS" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ICAS — International Center for Applied Science"
    />
    <meta
      name="twitter:description"
      content="Advancing knowledge. Improving lives."
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = t
            ? t === "dark"
            : window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 1rem">
        This site needs JavaScript enabled to run.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
